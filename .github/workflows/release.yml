name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-publish:
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project artifacts
        uses: ./.github/actions/build-sharkord
        with:
          bump: none

      - name: Get new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Fail if version is already released
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Bump package.json version in the PR to release." >&2
            exit 1
          fi

      - name: Get container image name
        id: get_image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Identify user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          registry: ghcr.io
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ steps.get_image.outputs.name }}:latest
            ${{ steps.get_image.outputs.name }}:v${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Sharkord
            org.opencontainers.image.description=Sharkord Server
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: true
          files: |
            apps/server/build/out/sharkord-linux-x64
            apps/server/build/out/sharkord-linux-arm64
            apps/server/build/out/sharkord-windows-x64.exe
            apps/server/build/out/sharkord-macos-arm64
            apps/server/build/out/release.json
          body: |
            ## Changes
            (TODO)

            ## Docker Image
            ```bash
            docker pull ${{ steps.get_image.outputs.name }}:v${{ steps.get_version.outputs.version }}
            ```
      - name: Create and push Git tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
